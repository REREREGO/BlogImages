<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,Arial" font-size="20" fill="#182b49" stroke-width="2"><text x="25" y="35" font-size="24">界面反射与折射：角度均相对法线测量</text><rect x="120" y="240" width="760" height="160" fill="#e0f2fe" stroke="#53657c"/><text x="805" y="220" font-size="20">n₁</text><text x="805" y="285" font-size="20">n₂</text><line x1="490" y1="75" x2="490" y2="405" stroke="#777"  stroke-dasharray="6 5"/><line x1="260" y1="90" x2="490" y2="240" stroke="#2563eb" marker-end="url(#arr)" /><line x1="490" y1="240" x2="720" y2="90" stroke="#2563eb" marker-end="url(#arr)" /><line x1="490" y1="240" x2="580" y2="390" stroke="#d946ef" marker-end="url(#arr)" /><text x="280" y="85" font-size="20">入射</text><text x="700" y="80" font-size="20">反射</text><text x="595" y="380" font-size="20">折射</text><text x="455" y="185" font-size="20">i</text><text x="505" y="300" font-size="20">r</text><text x="35" y="435" font-size="18">示意：n₂ &gt; n₁，折射光向法线偏折（不表示任意偏振下的相移规则）</text></g></svg>