<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#2563eb"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,Arial" font-size="20" fill="#182b49" stroke-width="2"><text x="25" y="35" font-size="24">薄膜反射干涉：上下表面的两束反射光</text><rect x="150" y="210" width="700" height="100" fill="#e0f2fe" stroke="#53657c"/><text x="780" y="180" font-size="20">n₁</text><text x="780" y="265" font-size="20">n₂</text><text x="780" y="345" font-size="20">n₃</text><line x1="350" y1="80" x2="480" y2="210" stroke="#e87924" marker-end="url(#arr)" /><line x1="480" y1="210" x2="610" y2="80" stroke="#2563eb" marker-end="url(#arr)" /><line x1="480" y1="210" x2="530" y2="310" stroke="#d946ef" marker-end="url(#arr)" /><line x1="530" y1="310" x2="580" y2="210" stroke="#d946ef" marker-end="url(#arr)" /><line x1="580" y1="210" x2="710" y2="80" stroke="#d946ef" marker-end="url(#arr)" /><line x1="480" y1="100" x2="480" y2="310" stroke="#999"  stroke-dasharray="6 5"/><line x1="890" y1="210" x2="890" y2="310" stroke="#2563eb" marker-end="url(#arr)" /><text x="910" y="270" font-size="20">d</text><text x="460" y="165" font-size="20">i</text><text x="490" y="265" font-size="20">r</text><text x="600" y="65" font-size="20">①</text><text x="710" y="65" font-size="20">②</text><text x="80" y="395" font-size="20">δ′ = 2n₂d cos r = 2d √(n₂² − n₁² sin²i)</text><text x="80" y="440" font-size="20">δ = δ′ + ηλ/2；η = 0 或 1，由两次反射的相对相变决定</text></g></svg>