<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#172554"><text x="30" y="35">起偏与检偏：自然光 → 线偏振光 → 检偏后的光</text><line x1="60" y1="180" x2="1030" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#ar)" /><line x1="95" y1="155" x2="95" y2="205" stroke="#f97316" stroke-width="2" /><circle cx="120" cy="180" r="4" fill="#f97316"/><line x1="155" y1="155" x2="155" y2="205" stroke="#f97316" stroke-width="2" /><circle cx="180" cy="180" r="4" fill="#f97316"/><line x1="215" y1="155" x2="215" y2="205" stroke="#f97316" stroke-width="2" /><circle cx="240" cy="180" r="4" fill="#f97316"/><ellipse cx="350" cy="180" rx="42" ry="90" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><line x1="350.0" y1="108.0" x2="350.0" y2="252.0" stroke="#c026d3" stroke-width="2" marker-end="url(#ar)" /><text x="330" y="300" font-size="20">P₁</text><ellipse cx="720" cy="180" rx="42" ry="90" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><line x1="673.7192921025692" y1="124.84480009543358" x2="766.2807078974308" y2="235.15519990456642" stroke="#c026d3" stroke-width="2" marker-end="url(#ar)" /><text x="700" y="300" font-size="20">P₂</text><line x1="460" y1="140" x2="460" y2="220" stroke="#f97316" stroke-width="2" /><line x1="520" y1="140" x2="520" y2="220" stroke="#f97316" stroke-width="2" /><line x1="580" y1="140" x2="580" y2="220" stroke="#f97316" stroke-width="2" /><line x1="820" y1="150" x2="860" y2="210" stroke="#f97316" stroke-width="2" /><line x1="880" y1="150" x2="920" y2="210" stroke="#f97316" stroke-width="2" /><line x1="940" y1="150" x2="980" y2="210" stroke="#f97316" stroke-width="2" /><text x="70" y="100" font-size="20">I₀：自然光</text><text x="420" y="100" font-size="20">I₁ = I₀ / 2</text><text x="800" y="100" font-size="20">I₂ = I₁ cos²θ</text><text x="750" y="140" font-size="20">θ</text><text x="30" y="345" font-size="19">转动单个起偏片：自然光透射强度不变；转动检偏片一周：两明两暗。</text><circle cx="200" cy="505" r="95" fill="#d1fae5" stroke="#0f766e" stroke-width="3"/><line x1="180" y1="435" x2="180" y2="575" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)" /><line x1="200.0" y1="435.0" x2="200.0" y2="575.0" stroke="#ec4899" stroke-width="2" marker-end="url(#ar)" /><text x="55" y="645" font-size="18">平行：θ = 0，I₂ = I₁</text><circle cx="550" cy="505" r="95" fill="#86a99a" stroke="#0f766e" stroke-width="3"/><line x1="530" y1="435" x2="530" y2="575" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)" /><line x1="500.50252531694167" y1="455.50252531694167" x2="599.4974746830583" y2="554.4974746830583" stroke="#ec4899" stroke-width="2" marker-end="url(#ar)" /><text x="405" y="645" font-size="18">斜交：θ = π/4，I₂ = I₁/2</text><circle cx="900" cy="505" r="95" fill="#14251f" stroke="#0f766e" stroke-width="3"/><line x1="880" y1="435" x2="880" y2="575" stroke="#2563eb" stroke-width="2" marker-end="url(#ar)" /><line x1="830.0" y1="505.0" x2="970.0" y2="505.0" stroke="#ec4899" stroke-width="2" marker-end="url(#ar)" /><text x="755" y="645" font-size="18">正交：θ = π/2，I₂ = 0</text><text x="50" y="710" font-size="18">蓝线：P₁透振方向；粉线：P₂透振方向。圆形明暗表示透射光强。</text></g></svg>