<svg xmlns="http://www.w3.org/2000/svg" width="850" height="420" viewBox="0 0 850 420"><rect width="850" height="420" fill="white"/><g font-family="Microsoft YaHei, sans-serif" fill="#163047"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3776b8"/></marker></defs><text x="425" y="40" font-size="23" text-anchor="middle">同态保持运算</text><ellipse cx="210" cy="185" rx="95" ry="115" fill="#e5f0ff" stroke="#3776b8"/><ellipse cx="640" cy="185" rx="95" ry="115" fill="#fff0d8" stroke="#c48023"/><text x="210" y="128" font-size="23" text-anchor="middle">x</text><text x="640" y="128" font-size="23" text-anchor="middle">a</text><path d="M320 120L530 120" stroke="#3776b8" stroke-width="2" marker-end="url(#a)"/><text x="210" y="193" font-size="23" text-anchor="middle">y</text><text x="640" y="193" font-size="23" text-anchor="middle">b</text><path d="M320 185L530 185" stroke="#3776b8" stroke-width="2" marker-end="url(#a)"/><text x="210" y="258" font-size="23" text-anchor="middle">z</text><text x="640" y="258" font-size="23" text-anchor="middle">c</text><path d="M320 250L530 250" stroke="#3776b8" stroke-width="2" marker-end="url(#a)"/><text x="210" y="330" font-size="23" text-anchor="middle">x ∘ y = z</text><text x="640" y="330" font-size="23" text-anchor="middle">a * b = c</text><text x="425" y="385" font-size="25" text-anchor="middle">f(x ∘ y) = f(x) * f(y)</text><text x="425" y="85" font-size="22" text-anchor="middle">f</text></g></svg>