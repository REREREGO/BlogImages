<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#1e40af"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,Arial" font-size="20" fill="#172554" stroke-width="2">
<text x="30" y="35" font-size="25">钟控锁存结构与状态转移（CP有效时）</text>
<rect x="40" y="80" width="530" height="180" rx="5" fill="#eff6ff" stroke="#1e40af"/>
<text x="54" y="110" font-size="20">共同核心：交叉耦合NAND RS锁存器</text>
<text x="54" y="137" font-size="20">rn=NAND(CP,R驱动)</text>
<text x="54" y="164" font-size="20">sn=NAND(CP,S驱动)</text>
<text x="54" y="191" font-size="20">CP=0 → rn=sn=1 → 保持</text>
<rect x="620" y="80" width="540" height="180" rx="5" fill="#eff6ff" stroke="#1e40af"/>
<text x="634" y="110" font-size="20">各结构的驱动</text>
<text x="634" y="137" font-size="20">RS：R驱动=R，S驱动=S</text>
<text x="634" y="164" font-size="20">D：R驱动=NOT D，S驱动=D</text>
<text x="634" y="191" font-size="20">JK：R驱动=KQ，S驱动=JQ̅</text>
<text x="634" y="218" font-size="20">T：J=K=T</text>
