<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#1e40af"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,Arial" font-size="20" fill="#172554" stroke-width="2">
<text x="30" y="35" font-size="25">三位×二位：六个与门产生部分积，四位加法器求和</text>
<rect x="80" y="90" width="400" height="90" rx="5" fill="#eff6ff" stroke="#1e40af"/>
<text x="94" y="120" font-size="20">A=a3a2a1，B=b2b1</text>
<text x="94" y="147" font-size="20">部分积 pij=ai AND bj</text>
<rect x="600" y="110" width="420" height="180" rx="5" fill="#eff6ff" stroke="#1e40af"/>
<text x="614" y="140" font-size="20">四位加法器</text>
<text x="614" y="167" font-size="20">A4…A1 = 0,p31,p21,p11</text>
<text x="614" y="194" font-size="20">B4…B1 = p32,p22,p12,0</text>
<text x="614" y="221" font-size="20">Cin=0</text>
<path d="M480 145L600 145" fill="none" stroke="#1e40af" marker-end="url(#ar)"/>
<path d="M1020 155L1130 155" fill="none" stroke="#1e40af" marker-end="url(#ar)"/>
<text x="1040" y="195" font-size="20">Z4…Z1</text>
<path d="M1020 245L1130 245" fill="none" stroke="#1e40af" marker-end="url(#ar)"/>
<text x="1060" y="280" font-size="20">Z5=Cout</text>
<text x="80" y="365" font-size="20">位权排列：      0     a3b1  a2b1  a1b1</text>
<text x="80" y="405" font-size="20">          + a3b2  a2b2  a1b2     0</text>
<text x="80" y="450" font-size="20">每一列采用算术加法并包含进位，不能把加号直接解释成逻辑或。</text>
</g></svg>