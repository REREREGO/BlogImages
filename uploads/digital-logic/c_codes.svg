<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#1e40af"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,Arial" font-size="20" fill="#172554" stroke-width="2">
<text x="30" y="35" font-size="25">8421码与余3码转换（四位总线；高位在左）</text>
<rect x="180" y="100" width="240" height="160" rx="5" fill="#eff6ff" stroke="#1e40af"/>
<text x="194" y="130" font-size="20">四位加法器</text>
<text x="194" y="157" font-size="20">A=8421码</text>
<text x="194" y="184" font-size="20">B=0011，Cin=0</text>
<path d="M420 165L530 165" fill="none" stroke="#1e40af" marker-end="url(#ar)"/>
<text x="540" y="170" font-size="20">余3码</text>
<rect x="760" y="100" width="300" height="160" rx="5" fill="#eff6ff" stroke="#1e40af"/>
<text x="774" y="130" font-size="20">四位加法器</text>
<text x="774" y="157" font-size="20">A=余3码</text>
<text x="774" y="184" font-size="20">B=1101，Cin=0</text>
<path d="M1060 165L1120 165" fill="none" stroke="#1e40af" marker-end="url(#ar)"/>
<text x="1080" y="210" font-size="20">8421码</text>
<text x="40" y="320" font-size="20">减3等价接法：B=1100，Cin=1；只取低四位，舍弃最高进位。</text>
</g></svg>