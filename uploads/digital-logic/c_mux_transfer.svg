<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#1e40af"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,Arial" font-size="20" fill="#172554" stroke-width="2">
<text x="30" y="35" font-size="25">MUX与DEMUX分时传输</text>
<rect x="150" y="110" width="240" height="170" rx="5" fill="#eff6ff" stroke="#1e40af"/>
<text x="164" y="140" font-size="20">4选1 MUX</text>
<text x="164" y="167" font-size="20">D0,D1,D2,D3</text>
<text x="164" y="194" font-size="20">选择=A1A0</text>
