<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#1e40af"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,Arial" font-size="20" fill="#172554" stroke-width="2">
<text x="30" y="35" font-size="25">译码器扩展：低有效使能选组，输出统一编号</text>
<rect x="100" y="100" width="370" height="130" rx="5" fill="#eff6ff" stroke="#1e40af"/>
<text x="114" y="130" font-size="20">2—4（低组）</text>
<text x="114" y="157" font-size="20">地址=A1,A0；en=A2</text>
<text x="114" y="184" font-size="20">输出=Y0…Y3（低有效）</text>
<rect x="680" y="100" width="390" height="130" rx="5" fill="#eff6ff" stroke="#1e40af"/>
<text x="694" y="130" font-size="20">2—4（高组）</text>
<text x="694" y="157" font-size="20">地址=A1,A0；en=NOT A2</text>
<text x="694" y="184" font-size="20">输出=Y4…Y7（低有效）</text>
<text x="80" y="285" font-size="20">4—16：两片3—8共享A2,A1,A0，用A3与NOT A3分别选组。</text>
<rect x="60" y="360" width="270" height="125" rx="5" fill="#eff6ff" stroke="#1e40af"/>
<text x="74" y="390" font-size="20">前级2—4</text>
<text x="74" y="417" font-size="20">输入=A3,A2</text>
<text x="74" y="444" font-size="20">4路低有效组选通</text>
<rect x="390" y="420" width="180" height="130" rx="5" fill="#eff6ff" stroke="#1e40af"/>
<text x="404" y="450" font-size="20">后级2—4 #0</text>
<text x="404" y="477" font-size="20">地址=A1,A0</text>
<text x="404" y="504" font-size="20">en=前级Y0</text>
<text x="404" y="531" font-size="20">Y0…Y3</text>
<polyline points="330,380 360,380 360,590 480,590 480,550" fill="none" stroke="#1e40af"/>
<rect x="585" y="420" width="180" height="130" rx="5" fill="#eff6ff" stroke="#1e40af"/>
<text x="599" y="450" font-size="20">后级2—4 #1</text>
<text x="599" y="477" font-size="20">地址=A1,A0</text>
<text x="599" y="504" font-size="20">en=前级Y1</text>
<text x="599" y="531" font-size="20">Y4…Y7</text>
<polyline points="330,405 370,405 370,605 675,605 675,550" fill="none" stroke="#1e40af"/>
<rect x="780" y="420" width="180" height="130" rx="5" fill="#eff6ff" stroke="#1e40af"/>
<text x="794" y="450" font-size="20">后级2—4 #2</text>
<text x="794" y="477" font-size="20">地址=A1,A0</text>
<text x="794" y="504" font-size="20">en=前级Y2</text>
<text x="794" y="531" font-size="20">Y8…Y11</text>
<polyline points="330,430 380,430 380,620 870,620 870,550" fill="none" stroke="#1e40af"/>
<rect x="975" y="420" width="180" height="130" rx="5" fill="#eff6ff" stroke="#1e40af"/>
<text x="989" y="450" font-size="20">后级2—4 #3</text>
<text x="989" y="477" font-size="20">地址=A1,A0</text>
<text x="989" y="504" font-size="20">en=前级Y3</text>
<text x="989" y="531" font-size="20">Y12…Y15</text>
<polyline points="330,455 390,455 390,635 1065,635 1065,550" fill="none" stroke="#1e40af"/>
<text x="40" y="710" font-size="20">常规5个2—4组成4—16：1个前级 + 4个后级；低有效输出可直接驱动低有效使能。</text>
</g></svg>